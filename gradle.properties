# Alokasi memori JVM yang optimal untuk laptop 6GB RAM
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -Dfile.encoding=UTF-8

# Batasi jumlah worker agar RAM tidak habis
org.gradle.parallel=false
org.gradle.workers.max=2

# Batas alokasi RAM untuk Kotlin compiler
kotlin.daemon.jvm.options=-Xmx1024m

# Konfigurasi AndroidX
android.useAndroidX=true
android.enableJetifier=false

# Penghematan kompilasi
org.gradle.caching=true
